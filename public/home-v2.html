    <style>
        @font-face {
            font-family: 'LTT Recoletta';
            src: url('/fonts/LttRecoleta-CmpRegular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Berkeley Mono';
            src: url('/fonts/BerkeleyMono-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { overflow-x: hidden; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ─── Header ─── */
        .header-section {
            text-align: center;
            padding: 30px 20px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .app-icon {
            width: 60px; height: 60px;
            margin: 0 auto 24px;
            display: block;
            border-radius: 18px;
        }

        h1 { font-size: 20px; font-weight: 600; margin-bottom: 16px; letter-spacing: -0.5px; line-height: 1.1; }

        .intro {
            font-size: 24px; color: #e0e0e0; margin-bottom: 20px;
            line-height: 1.4; font-weight: 400;
        }

        .cta-buttons {
            display: flex; justify-content: center; align-items: center;
            gap: 12px; flex-wrap: wrap;
        }

        .button {
            display: inline-block; background-color: #ffffff; color: #000000;
            text-decoration: none; padding: 12px 32px; border-radius: 12px;
            font-size: 16px; font-weight: 500; transition: background-color 0.2s ease;
            border: none; cursor: pointer;
        }
        .button:hover { background-color: #e0e0e0; }
        .button.secondary {
            background-color: transparent; color: #ffffff;
            border: 1px solid rgba(255,255,255,0.35);
        }
        .button.secondary:hover { background-color: rgba(255,255,255,0.12); }

        .switch-link {
            display: inline-block;
            margin-top: 16px;
            font-family: 'Berkeley Mono', 'Courier New', Courier, monospace;
            font-size: 11px;
            color: rgba(255,255,255,0.45);
            text-decoration: none;
            letter-spacing: 0.3px;
            transition: color 0.2s;
        }
        .switch-link:hover { color: rgba(255,255,255,0.8); }

        /* ─── Rails ─── */
        .rails-container {
            padding: 0 0 60px;
        }

        .rail {
            margin-bottom: 32px;
        }

        .rail-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 0 24px 12px;
        }

        .rail-title {
            font-family: 'LTT Recoletta', Georgia, serif;
            font-size: 22px;
            font-weight: 400;
            color: #ffffff;
        }

        .rail-count {
            font-family: 'Berkeley Mono', 'Courier New', Courier, monospace;
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .rail-track {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 0 24px 8px;
            scroll-snap-type: x proximity;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .rail-track::-webkit-scrollbar { display: none; }

        /* ─── Cards ─── */
        .rail-card {
            flex-shrink: 0;
            width: 260px;
            height: 340px;
            border-radius: 20px;
            overflow: hidden;
            background-color: #000;
            cursor: pointer;
            position: relative;
            scroll-snap-align: start;
            transition: transform 0.2s ease;
        }
        .rail-card:hover { transform: scale(1.03); }

        .rail-card img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }

        .rail-card-gradient {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 55%;
            background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.75) 45%, transparent 100%);
            pointer-events: none;
        }

        .rail-card-info {
            position: absolute; bottom: 0; left: 0;
            width: 100%; padding: 20px;
            display: flex; flex-direction: column; gap: 6px;
            z-index: 1;
        }

        .rail-card-title {
            font-family: 'LTT Recoletta', Georgia, serif;
            font-size: 20px; font-weight: 400;
            line-height: 1.1; color: #fff;
        }

        .rail-card-meta {
            font-family: 'Berkeley Mono', 'Courier New', Courier, monospace;
            font-size: 9px; color: rgba(255,255,255,0.7);
            text-transform: uppercase; letter-spacing: 0.4px;
            display: flex; gap: 8px; flex-wrap: wrap;
        }

        .rail-card-category {
            display: inline-block;
            padding: 3px 7px; border-radius: 3px;
            font-size: 9px; font-weight: 500;
            text-transform: uppercase; letter-spacing: 0.5px;
            font-family: 'Berkeley Mono', 'Courier New', Courier, monospace;
            background-color: #2a2a2a; color: #fff;
        }

        /* ─── Loading ─── */
        #loadingSpinner {
            display: flex; align-items: center; justify-content: center;
            padding: 60px 0;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #fff; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── Modal (reused from index.html) ─── */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9); backdrop-filter: blur(8px);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            padding: 20px; opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            overflow-y: auto;
        }
        .modal-overlay.open { opacity: 1; visibility: visible; }

        .modal-content {
            position: relative; background-color: #1a1a1a;
            border-radius: 32px; max-width: 900px; width: 100%;
            max-height: 90vh; overflow-y: auto;
            transform: scale(0.95); transition: transform 0.3s ease;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .modal-overlay.open .modal-content { transform: scale(1); }

        .modal-close {
            position: absolute; top: 20px; right: 20px;
            width: 40px; height: 40px; border-radius: 50%;
            background-color: rgba(255,255,255,0.1); border: none;
            color: #fff; font-size: 24px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 1001; transition: background-color 0.2s ease, transform 0.2s ease;

            background-color: #2a2a2a; color: #fff; margin-bottom: 20px;
        }

        .modal-title {
            font-family: 'LTT Recoletta', Georgia, serif;
            font-size: 48px; font-weight: 400; line-height: 1.1;
            color: #fff; margin: 0 0 24px;

        .modal-description {
            font-size: 16px; line-height: 1.6; color: #e0e0e0; margin: 0 0 24px;
        }

        .modal-meta {

            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .modal-meta-item {
            display: flex; align-items: center; gap: 8px;
            font-family: 'Berkeley Mono', 'Courier New', Courier, monospace;
            font-size: 10px; color: #b0b0b0;
            text-transform: uppercase; letter-spacing: 0.5px;

        .modal-date {

        .modal-tag {
            padding: 4px 8px; border-radius: 4px;
            font-size: 10px; font-weight: 500; text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: 'Berkeley Mono', 'Courier New', Courier, monospace;
            background-color: rgba(255,255,255,0.1); color: #fff;
        }

        .modal-header {
            position: absolute; top: 0; left: 0; right: 0;
            display: flex; justify-content: flex-end; align-items: flex-start;

            position: absolute; bottom: 20px; right: 20px;

            font-size: 14px; font-weight: 500; cursor: pointer;

        }

        /* ─── Audio Player ─── */
        .modal-audio-player {
            margin-top: 24px; padding: 20px;
            background-color: #2a2a2a; border-radius: 12px;

        .audio-play-pause:hover { background-color: #e0e0e0; transform: scale(1.05); }
        .audio-progress-container { flex: 1; }
        .audio-progress-bar {
            width: 100%; height: 4px;
            background-color: rgba(255,255,255,0.2);
            border-radius: 2px; cursor: pointer; position: relative;
        }
        .audio-progress-filled {
            height: 100%; background-color: #fff;
            border-radius: 2px; width: 0%;

        .audio-time {
            display: flex; align-items: center; gap: 4px;
            font-family: 'Berkeley Mono', 'Courier New', Courier, monospace;

        .audio-error {

        .audio-loading { opacity: 0.6; pointer-events: none; }

        body.modal-open { overflow: hidden; }

        .share-toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background-color: #fff; color: #000; padding: 12px 24px;

            z-index: 3000; opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .share-toast.show { opacity: 1; visibility: visible; }

        .site-footer {
            display: flex; justify-content: center; gap: 16px;

        .site-footer a { color: inherit; text-decoration: none; }
        .site-footer a svg { width: 24px; height: 24px; fill: currentColor; display: block; }

        /* ─── Mobile ─── */
        @media (max-width: 768px) {

            h1 { font-size: 18px; }
            .intro { font-size: 20px; margin-bottom: 16px; }
            .button { padding: 11px 16px; font-size: 14px; }
            .cta-buttons {
                flex-direction: row; flex-wrap: nowrap; gap: 8px;
                width: 100%; max-width: 360px; margin: 0 auto;

            .rail-title { font-size: 18px; }

            .rail-card { width: 220px; height: 290px; border-radius: 16px; }
            .rail-card-title { font-size: 17px; }
            .rail-card-info { padding: 16px; }
            .rail { margin-bottom: 24px; }

            .modal-content { max-width: 100%; border-radius: 24px; max-height: 95vh; }

            .audio-controls { flex-wrap: wrap; gap: 12px; }
            .audio-play-pause { width: 44px; height: 44px; font-size: 16px; }
            .audio-time { min-width: 80px; font-size: 11px; }
            .audio-get-angle-btn { padding: 8px 16px; font-size: 11px; }
            .modal-share-btn { bottom: 15px; right: 15px; padding: 6px 12px; font-size: 12px; }
        }

        @media (max-width: 360px) {
            .cta-buttons { max-width: 100%; }
            .cta-buttons .button { font-size: 13px; padding: 11px 12px; }
        }
    </style>
</head>

    <script>
        let episodes = [];
        let currentEpisodeId = null;
        let currentAudio = null;
        const CANONICAL_BASE_URL = 'https://www.newsangle.co';

        // ─── Helpers ───
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();
        }

        function formatCardDate(dateString) {
            if (!dateString) return null;
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).replace(',', '');
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return '0:00';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            return h > 0
                ? `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`
                : `${m}:${s.toString().padStart(2,'0')}`;
        }

        function formatDuration(seconds) {
            if (!seconds) return null;
            return formatTime(seconds);
        }

        // ─── Card creation ───
        function createRailCard(episode) {
            const card = document.createElement('div');
            card.className = 'rail-card';
            const dateText = episode.createdAt ? formatCardDate(episode.createdAt) : '';
            card.innerHTML = `
                <img src="${episode.coverImage || '/images/icon.webp'}" alt="${episode.title}" loading="lazy">
                <div class="rail-card-gradient"></div>
                <div class="rail-card-info">
                    <h3 class="rail-card-title">${episode.title}</h3>
                    <div class="rail-card-meta">
                        ${episode.host ? `<span>${episode.host}</span>` : ''}
                        ${dateText ? `<span>${dateText}</span>` : ''}
                    </div>
                    ${episode.category ? `<span class="rail-card-category">${episode.category.toUpperCase()}</span>` : ''}
                </div>
            `;
            card.addEventListener('click', () => openStoryModal(episode));
            return card;
        }

        // ─── Build rails ───
        function buildRails(episodes, categories) {
            const container = document.getElementById('railsContainer');
            container.innerHTML = '';

            // Rail 1: New — latest stories
            const sorted = [...episodes].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            addRail(container, 'New', sorted);

            // Rail 2: Popular — top 30% most recent
            const popular = sorted.slice(0, Math.ceil(sorted.length * 0.3));
            addRail(container, 'Popular', popular);

            // One rail per category
            categories.forEach(cat => {
                const catEpisodes = episodes.filter(ep => ep.category === cat);
                if (catEpisodes.length > 0) {
                    addRail(container, cat, catEpisodes);
                }
            });
        }

        function addRail(container, title, items) {
            const section = document.createElement('section');
            section.className = 'rail';
            section.innerHTML = `
                <div class="rail-header">
                    <h2 class="rail-title">${title}</h2>
                    <span class="rail-count">${items.length} stories</span>
                </div>
            `;
            const track = document.createElement('div');
            track.className = 'rail-track';
            items.forEach(ep => track.appendChild(createRailCard(ep)));
            section.appendChild(track);
            container.appendChild(section);
        }

        // ─── Modal ───
        function openStoryModal(episode) {
            const modal = document.getElementById('storyModal');
            document.getElementById('modalImage').src = episode.coverImage || '/images/icon.webp';
            document.getElementById('modalImage').alt = episode.title;

            const cat = document.getElementById('modalCategory');
            if (episode.category) { cat.textContent = episode.category.toUpperCase(); cat.style.display = 'inline-block'; }
            else { cat.style.display = 'none'; }

            document.getElementById('modalTitle').textContent = episode.title;

            let metaHTML = '';
            if (episode.episodeNumber) metaHTML += `<div class="modal-meta-item"><strong>Episode</strong> ${episode.episodeNumber}</div>`;
            if (episode.duration) { const d = formatDuration(episode.duration); if (d) metaHTML += `<div class="modal-meta-item"><strong>Duration</strong> ${d}</div>`; }
            if (episode.host) metaHTML += `<div class="modal-meta-item"><strong>Host</strong> ${episode.host}</div>`;
            const metaEl = document.getElementById('modalMeta');
            metaEl.innerHTML = metaHTML; metaEl.style.display = metaHTML ? 'flex' : 'none';

            document.getElementById('modalDescription').textContent = episode.fullDescription || episode.description || 'No description available.';

            const tagsEl = document.getElementById('modalTags');
            if (episode.tags && episode.tags.length) {
                tagsEl.innerHTML = episode.tags.map(t => `<span class="modal-tag">${t.toUpperCase()}</span>`).join('');
                tagsEl.style.display = 'flex';
            } else { tagsEl.innerHTML = ''; tagsEl.style.display = 'none'; }

            initAudioPlayer(episode.audioUrl || null);
            document.getElementById('modalDate').textContent = formatDate(episode.createdAt);

            currentEpisodeId = episode.id;
            window.history.pushState({ episodeId: episode.id }, '', `/episode/${episode.id}`);

            modal.classList.add('open');
            document.body.classList.add('modal-open');
        }

        function closeStoryModal() {
            cleanupAudio();
            document.getElementById('storyModal').classList.remove('open');
            document.body.classList.remove('modal-open');
            currentEpisodeId = null;
            window.history.pushState({}, '', '/home-v2');
        }

        // ─── Audio ───
        function initAudioPlayer(audioUrl) {
            const el = document.getElementById('audioElement');
            const player = document.getElementById('modalAudioPlayer');
            const btn = document.getElementById('audioPlayPause');
            const playIcon = btn.querySelector('.play-icon');
            const pauseIcon = btn.querySelector('.pause-icon');
            const filled = document.getElementById('audioProgressFilled');
            const cur = document.getElementById('audioTimeCurrent');
            const dur = document.getElementById('audioTimeDuration');
            const err = document.getElementById('audioError');

            err.style.display = 'none';
            playIcon.style.display = 'inline'; pauseIcon.style.display = 'none';
            filled.style.width = '0%'; cur.textContent = '0:00'; dur.textContent = '0:00';

            if (!audioUrl) { player.style.display = 'none'; return; }

            el.src = audioUrl; player.style.display = 'block'; currentAudio = el; el.load();

            el.onloadedmetadata = () => { if (isFinite(el.duration)) dur.textContent = formatTime(el.duration); };
            el.ontimeupdate = () => {
                if (isFinite(el.duration) && el.duration > 0) {
                    filled.style.width = `${(el.currentTime / el.duration) * 100}%`;
                    cur.textContent = formatTime(el.currentTime);
                }
            };
            el.onplay = () => { playIcon.style.display = 'none'; pauseIcon.style.display = 'inline'; };
            el.onpause = () => { playIcon.style.display = 'inline'; pauseIcon.style.display = 'none'; };
            el.onerror = () => { err.style.display = 'block'; };
        }

        function cleanupAudio() {
            const el = document.getElementById('audioElement');
            if (el) { el.pause(); el.src = ''; el.load(); }
            currentAudio = null;
        }

        // ─── Share ───
        function showShareToast() {
            let toast = document.getElementById('shareToast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'shareToast'; toast.className = 'share-toast';
                toast.textContent = 'Link copied!'; document.body.appendChild(toast);
            }
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        async function handleShare(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            const url = currentEpisodeId ? `${CANONICAL_BASE_URL}/episode/${currentEpisodeId}` : `${CANONICAL_BASE_URL}/home-v2`;
            if (navigator.share) {
                try { await navigator.share({ url }); showShareToast(); return; } catch (err) { if (err?.name === 'AbortError') return; }
            }
            try { await navigator.clipboard.writeText(url); showShareToast(); } catch { alert('Copy manually: ' + url); }
        }

        // ─── Init ───
        async function init() {
            try {
                const [catRes, epRes] = await Promise.all([fetch('/api/categories'), fetch('/api/episodes')]);
                const catData = await catRes.json();
                const epData = await epRes.json();

                document.getElementById('loadingSpinner').style.display = 'none';

                const categories = catData.success ? catData.data : [];
                if (epData.success) {
                    episodes = epData.data;
                    buildRails(episodes, categories);
                } else {
                    document.getElementById('railsContainer').innerHTML = '<div style="text-align:center;padding:40px;color:#b0b0b0;">Failed to load episodes</div>';
                }
            } catch (err) {
                console.error('Init error:', err);
                document.getElementById('loadingSpinner').style.display = 'none';
                document.getElementById('railsContainer').innerHTML = '<div style="text-align:center;padding:40px;color:#b0b0b0;">Failed to load episodes</div>';
            }
        }

        // Event listeners
        document.getElementById('modalClose').addEventListener('click', e => { e.stopPropagation(); closeStoryModal(); });
        document.getElementById('storyModal').addEventListener('click', e => { if (e.target === document.getElementById('storyModal')) closeStoryModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('storyModal').classList.contains('open')) closeStoryModal(); });
        document.getElementById('audioPlayPause').addEventListener('click', () => {
            const el = document.getElementById('audioElement');
            if (!el || !el.src) return;
            el.paused ? el.play().catch(() => {}) : el.pause();
        });
        document.getElementById('audioProgressBar').addEventListener('click', e => {
            const el = document.getElementById('audioElement');
            if (!el || !el.src || el.readyState === 0) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            if (isFinite(el.duration)) el.currentTime = pct * el.duration;
        });
        document.getElementById('modalShareBtn').addEventListener('click', e => handleShare(e));

        window.addEventListener('popstate', () => {
            if (document.getElementById('storyModal').classList.contains('open')) closeStoryModal();
        });

        init();
    </script>
</body>
</html>
